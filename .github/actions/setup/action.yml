name: Setup
description: Install pnpm, Node and the project dependencies from a warm cache.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: "pnpm-lock.yaml"

    - run: pnpm install --frozen-lockfile
      shell: bash

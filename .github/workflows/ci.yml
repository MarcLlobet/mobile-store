name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Prettier
            run: pnpm format:check
          - name: ESLint
            run: pnpm lint --max-warnings=0
          - name: Types
            run: pnpm typecheck
          - name: Tests
            run: pnpm exec vitest run --coverage
          - name: Build
            run: pnpm build
            artifact: static-export
            path: out
          - name: Storybook
            run: pnpm build-storybook
            artifact: storybook
            path: storybook-static
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.run }}
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}

      - name: Keep the output for the Pages bundle
        if: matrix.check.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.check.artifact }}
          path: ${{ matrix.check.path }}
          retention-days: 1
          if-no-files-found: error

  bundle:
    name: Bundle the Pages artifact
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download the static export
        uses: actions/download-artifact@v4
        with:
          name: static-export
          path: out

      - name: Nest Storybook under /storybook
        uses: actions/download-artifact@v4
        with:
          name: storybook
          path: out/storybook

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Prettier
            run: pnpm format:check
          - name: ESLint
            run: pnpm lint --max-warnings=0
          - name: Types
            run: pnpm typecheck
          - name: Tests
            run: pnpm exec vitest run --coverage
          # Builds the app and then Storybook straight into out/storybook, so the
          # thing that gets uploaded is already the thing that gets served. The
          # order matters: `next build` empties out/ before it writes.
          - name: Build
            run: pnpm build:pages
            pages: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.run }}
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}

      # Uploaded once, in the job that produced it, and read only by deploy-pages.
      - name: Upload the Pages artifact
        if: matrix.check.pages && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
